services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: applymate-pgvector
    environment:
      POSTGRES_USER: applymate
      POSTGRES_PASSWORD: applymate
      POSTGRES_DB: applymate
    ports:
      - "5433:5432"
    volumes:
      - applymate_pgdata:/var/lib/postgresql/data

volumes:
  applymate_pgdata:
